<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 360" width="100%" height="100%">
  <defs>
    <!-- Background Gradient -->
    <linearGradient id="bg-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#090d16" />
      <stop offset="50%" stop-color="#0e1726" />
      <stop offset="100%" stop-color="#050811" />
    </linearGradient>

    <!-- Funnel / Accent Gradients -->
    <linearGradient id="funnel-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#6366f1">
        <animate attributeName="stop-color" values="#6366f1; #3b82f6; #8b5cf6; #6366f1" dur="8s" repeatCount="indefinite" />
      </stop>
      <stop offset="100%" stop-color="#ec4899">
        <animate attributeName="stop-color" values="#ec4899; #06b6d4; #10b981; #ec4899" dur="8s" repeatCount="indefinite" />
      </stop>
    </linearGradient>

    <linearGradient id="text-grad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#ffffff" />
      <stop offset="50%" stop-color="#e0e7ff" />
      <stop offset="100%" stop-color="#a5b4fc" />
    </linearGradient>

    <linearGradient id="gold-grad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#fbbf24" />
      <stop offset="100%" stop-color="#f59e0b" />
    </linearGradient>

    <!-- Glow Filter -->
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="8" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>

    <!-- Grid Pattern -->
    <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M 40 0 L 0 0 0 40" fill="none" stroke="rgba(255, 255, 255, 0.03)" stroke-width="1" />
      <circle cx="40" cy="40" r="1" fill="rgba(255, 255, 255, 0.08)" />
    </pattern>
  </defs>

  <style>
    .title-text {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif;
      font-weight: 800;
      font-size: 40px;
      letter-spacing: -0.5px;
    }
    .subtitle-text {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif;
      font-weight: 500;
      font-size: 15px;
      fill: #94a3b8;
      letter-spacing: 0.2px;
    }
    .badge-text {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif;
      font-weight: 700;
      font-size: 11px;
      letter-spacing: 1.5px;
      text-transform: uppercase;
    }
    .stat-number {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif;
      font-weight: 800;
      font-size: 19px;
      fill: #ffffff;
    }
    .stat-label {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif;
      font-weight: 500;
      font-size: 10px;
      fill: #64748b;
      letter-spacing: 0.5px;
    }
  </style>

  <!-- Background Base -->
  <rect width="1200" height="360" rx="16" fill="url(#bg-grad)" />
  <rect width="1200" height="360" rx="16" fill="url(#grid)" />

  <!-- Outer Border / Card Outline -->
  <rect width="1198" height="358" x="1" y="1" rx="15" fill="none" stroke="rgba(255, 255, 255, 0.08)" stroke-width="1.5" />

  <!-- Dynamic Ambient Glow Blobs -->
  <circle cx="950" cy="180" r="140" fill="#6366f1" opacity="0.15" filter="url(#glow)">
    <animate attributeName="r" values="130;160;130" dur="6s" repeatCount="indefinite" />
    <animate attributeName="opacity" values="0.12;0.22;0.12" dur="6s" repeatCount="indefinite" />
  </circle>
  <circle cx="1100" cy="100" r="90" fill="#ec4899" opacity="0.12" filter="url(#glow)">
    <animate attributeName="r" values="80;110;80" dur="7s" repeatCount="indefinite" />
  </circle>
  <circle cx="850" cy="280" r="100" fill="#06b6d4" opacity="0.10" filter="url(#glow)">
    <animate attributeName="r" values="90;120;90" dur="5s" repeatCount="indefinite" />
  </circle>

  <!-- LEFT HERO SECTION -->
  <g transform="translate(70, 50)">
    <!-- Pill Tag -->
    <g transform="translate(0, 0)">
      <rect width="210" height="28" rx="14" fill="rgba(99, 102, 241, 0.15)" stroke="rgba(99, 102, 241, 0.3)" stroke-width="1" />
      <circle cx="16" cy="14" r="4" fill="#6366f1">
        <animate attributeName="opacity" values="0.4;1;0.4" dur="2s" repeatCount="indefinite" />
      </circle>
      <text x="28" y="18" fill="#818cf8" class="badge-text">Macro Market Research</text>
    </g>

    <!-- Main Title -->
    <text x="0" y="70" fill="url(#text-grad)" class="title-text">
      VC Funding Funnel
    </text>
    <text x="0" y="115" fill="url(#funnel-grad)" class="title-text">
      Analysis &amp; Dynamics
    </text>

    <!-- Subtitle -->
    <text x="0" y="152" class="subtitle-text">
      Macro Absorption &amp; Survival Realities for 40,000+ Early-Stage Startups
    </text>

    <!-- Quick Stat Badges Row -->
    <g transform="translate(0, 182)">
      <!-- Card 1 -->
      <g transform="translate(0, 0)">
        <rect width="155" height="58" rx="10" fill="rgba(255, 255, 255, 0.03)" stroke="rgba(255, 255, 255, 0.08)" stroke-width="1" />
        <text x="16" y="26" class="stat-number">40,000</text>
        <text x="16" y="44" class="stat-label">ANNUAL APPLICANTS</text>
      </g>

      <!-- Card 2 -->
      <g transform="translate(170, 0)">
        <rect width="155" height="58" rx="10" fill="rgba(236, 72, 153, 0.05)" stroke="rgba(236, 72, 153, 0.2)" stroke-width="1" />
        <text x="16" y="26" class="stat-number" fill="#f43f5e">3.81%</text>
        <text x="16" y="44" class="stat-label">TOP-20 INSTITUTIONAL</text>
      </g>

      <!-- Card 3 -->
      <g transform="translate(340, 0)">
        <rect width="155" height="58" rx="10" fill="rgba(16, 185, 129, 0.05)" stroke="rgba(16, 185, 129, 0.2)" stroke-width="1" />
        <text x="16" y="26" class="stat-number" fill="#10b981">28.00%</text>
        <text x="16" y="44" class="stat-label">BOOTSTRAPPED REVENUE</text>
      </g>
    </g>
  </g>

  <!-- RIGHT DYNAMIC FUNNEL VISUALIZATION -->
  <g transform="translate(730, 30)">
    <!-- Funnel Tier 1: 40k Initial Applications -->
    <path d="M 50 30 L 370 30 L 340 75 L 80 75 Z" fill="rgba(99, 102, 241, 0.25)" stroke="rgba(99, 102, 241, 0.8)" stroke-width="1.5">
      <animate attributeName="fill" values="rgba(99, 102, 241, 0.2); rgba(99, 102, 241, 0.38); rgba(99, 102, 241, 0.2)" dur="4s" repeatCount="indefinite" />
    </path>
    <text x="210" y="58" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="13" font-weight="700" fill="#e0e7ff">
      Total Applicant Universe (40,000 / 100%)
    </text>

    <!-- Funnel Tier 2: Remaining Non-YC Pipeline -->
    <path d="M 85 85 L 335 85 L 305 130 L 115 130 Z" fill="rgba(59, 130, 246, 0.2)" stroke="rgba(59, 130, 246, 0.7)" stroke-width="1.5">
      <animate attributeName="fill" values="rgba(59, 130, 246, 0.15); rgba(59, 130, 246, 0.32); rgba(59, 130, 246, 0.15)" dur="4s" begin="1s" repeatCount="indefinite" />
    </path>
    <text x="210" y="113" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="13" font-weight="600" fill="#bfdbfe">
      Macro Absorption Pool (38,474 / 96.19%)
    </text>

    <!-- Funnel Tier 3: Alternative Solvents (Angels, Grants, Bootstrapping) -->
    <path d="M 120 140 L 300 140 L 270 185 L 150 185 Z" fill="rgba(16, 185, 129, 0.2)" stroke="rgba(16, 185, 129, 0.7)" stroke-width="1.5">
      <animate attributeName="fill" values="rgba(16, 185, 129, 0.15); rgba(16, 185, 129, 0.32); rgba(16, 185, 129, 0.15)" dur="4s" begin="2s" repeatCount="indefinite" />
    </path>
    <text x="210" y="167" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="13" font-weight="600" fill="#a7f3d0">
      Angels, Grants &amp; Bootstrapped (18,400)
    </text>

    <!-- Funnel Tier 4: Top Institutional Check Cleared -->
    <path d="M 155 195 L 265 195 L 235 240 L 185 240 Z" fill="url(#gold-grad)" opacity="0.85" stroke="#fbbf24" stroke-width="1.5" filter="url(#glow)">
      <animate attributeName="opacity" values="0.75; 1; 0.75" dur="3s" repeatCount="indefinite" />
    </path>
    <text x="210" y="222" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="12" font-weight="800" fill="#1e1b4b">
      ★ Top-20 Elite (1,526 / 3.81%)
    </text>

    <!-- Animated Particle Streams descending into funnel -->
    <g stroke="none">
      <!-- Particle Stream 1 -->
      <circle cx="210" cy="30" r="3.5" fill="#a5b4fc" filter="url(#glow)">
        <animate attributeName="cy" values="30; 240" dur="2.5s" repeatCount="indefinite" />
        <animate attributeName="opacity" values="0; 1; 1; 0" dur="2.5s" repeatCount="indefinite" />
        <animate attributeName="r" values="3.5; 2; 1" dur="2.5s" repeatCount="indefinite" />
      </circle>

      <!-- Particle Stream 2 -->
      <circle cx="160" cy="30" r="3" fill="#67e8f9" filter="url(#glow)">
        <animate attributeName="cx" values="160; 195" dur="3.2s" begin="0.8s" repeatCount="indefinite" />
        <animate attributeName="cy" values="30; 240" dur="3.2s" begin="0.8s" repeatCount="indefinite" />
        <animate attributeName="opacity" values="0; 0.9; 0.9; 0" dur="3.2s" begin="0.8s" repeatCount="indefinite" />
      </circle>

      <!-- Particle Stream 3 -->
      <circle cx="260" cy="30" r="3" fill="#f472b6" filter="url(#glow)">
        <animate attributeName="cx" values="260; 225" dur="2.8s" begin="1.4s" repeatCount="indefinite" />
        <animate attributeName="cy" values="30; 240" dur="2.8s" begin="1.4s" repeatCount="indefinite" />
        <animate attributeName="opacity" values="0; 0.9; 0.9; 0" dur="2.8s" begin="1.4s" repeatCount="indefinite" />
      </circle>
    </g>

    <!-- Flow Indicator Nodes below funnel -->
    <g transform="translate(140, 255)">
      <rect width="140" height="24" rx="12" fill="rgba(251, 191, 36, 0.15)" stroke="rgba(251, 191, 36, 0.4)" stroke-width="1" />
      <text x="70" y="16" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="11" font-weight="700" fill="#fde68a">
        HIGH-CONVICTION NET
      </text>
    </g>
  </g>

  <!-- Decorative Corner Accents -->
  <path d="M 20 50 L 20 20 L 50 20" stroke="rgba(99, 102, 241, 0.5)" stroke-width="2" fill="none" />
  <path d="M 1180 50 L 1180 20 L 1150 20" stroke="rgba(99, 102, 241, 0.5)" stroke-width="2" fill="none" />
  <path d="M 20 310 L 20 340 L 50 340" stroke="rgba(99, 102, 241, 0.5)" stroke-width="2" fill="none" />
  <path d="M 1180 310 L 1180 340 L 1150 340" stroke="rgba(99, 102, 241, 0.5)" stroke-width="2" fill="none" />
</svg>
